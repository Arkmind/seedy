<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Seedy</title>
</head>
<body>
    <div id="SeedyConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button">
        <div data-role="content">
            <div class="content-primary">
                <div class="verticalSection">
                    <h2 class="sectionTitle">Seedy</h2>
                    <p>Seedy is a web client for this server with Seerr requests, a home screen that learns from each profile, and a play log.
                       Its settings live in Seedy's own admin: where it opens, branding, playback defaults, the home screen, requests and the play log.</p>
                    <p id="seedyWhere" class="fieldDescription"></p>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 0.5em;">
                    <a is="emby-linkbutton" id="seedyAdminLink" class="raised button-submit emby-button" target="_blank" rel="noopener" href="#">
                        <span>Open Seedy admin</span>
                    </a>
                    <a is="emby-linkbutton" id="seedyLink" class="raised emby-button" target="_blank" rel="noopener" href="#">
                        <span>Open Seedy</span>
                    </a>
                </div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#SeedyConfigPage');
                page.addEventListener('pageshow', function () {
                    var base = ApiClient.serverAddress();
                    ApiClient.getPluginConfiguration('b547483f-57e9-439e-8a2a-561828a524a6').then(function (config) {
                        var atRoot = config.OpensAt !== 'alongside';
                        var app = atRoot ? base : base + '/seedy';
                        page.querySelector('#seedyAdminLink').href = app + '/admin';
                        page.querySelector('#seedyLink').href = app + '/';
                        page.querySelector('#seedyWhere').textContent = atRoot
                            ? 'Seedy replaces Jellyfin’s web app at the server address. Jellyfin’s app moved to /old.'
                            : 'Seedy opens at /seedy. The server address still opens Jellyfin’s app.';
                    });
                });
            })();
        </script>
    </div>
</body>
</html>
