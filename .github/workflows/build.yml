name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Typecheck, build the web app and the plugin
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: seedy-plugin
          path: artifacts/seedy_*.zip
